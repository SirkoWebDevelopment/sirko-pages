<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sirko Dev Studio</title>
<meta name="description" content="Sirko Dev Studio — free, professional websites for non-profits and small businesses who can't afford one." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Mulish:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; }
  :root {
    --accent: #D8843E;
    --accent-deep: #B8662A;
    --paper: #FBF6EE;
    --surface: #FFFDF9;
    --ink: #2B231A;
    --muted: #6E6253;
    --line: #E7DCCB;
    --font-head: 'Newsreader', serif;
    --font-body: 'Mulish', sans-serif;
    --maxw: 1180px;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    transition: background .4s ease, color .4s ease;
  }
  ::selection { background: var(--accent); color: #fff; }
  a { color: inherit; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="tweaks.js"></script>
<script src="app.js"></script>
</body>
</html>
